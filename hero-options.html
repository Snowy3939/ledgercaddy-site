<section><div class="wrap" style="max-width:1000px"><div class="eyebrow">Layout C hero</div><h2>Five images that sell LedgerCaddy.</h2><p class="sub" style="margin-top:8px">Each is built at the hero slot's proportions (1200×760, rendered at 2×) in the Harbor palette. Pick one, or tell me which pieces to combine.</p><figure style="margin-top:36px"><div class="eyebrow">Option 1</div><h2 style="font-size:24px">The real app, readable</h2><p class="sub" style="margin:6px 0 14px">Reports window with the live-totals strip and category bars pulled forward at readable size. Honest and concrete.</p><div class="crop"><img src="images/hero/hero-1.png" alt="Hero option 1"></div></figure><figure style="margin-top:36px"><div class="eyebrow">Option 2</div><h2 style="font-size:24px">The year at a glance</h2><p class="sub" style="margin:6px 0 14px">A custom dashboard: big net figure, a rising 12-month line, money in / out / tax collected, and top categories. Sells clarity.</p><div class="crop"><img src="images/hero/hero-2.png" alt="Hero option 2"></div></figure><figure style="margin-top:36px"><div class="eyebrow">Option 3</div><h2 style="font-size:24px">The Period Pack</h2><p class="sub" style="margin:6px 0 14px">A fanned stack of year-end report pages with a 'Ready for your accountant' badge. Sells the deliverable.</p><div class="crop"><img src="images/hero/hero-3.png" alt="Hero option 3"></div></figure><figure style="margin-top:36px"><div class="eyebrow">Option 4</div><h2 style="font-size:24px">One file on your Mac</h2><p class="sub" style="margin:6px 0 14px">Laptop illustration with the book file front and centre, ringed by No cloud / No account / Works offline / Yours forever. Sells privacy.</p><div class="crop"><img src="images/hero/hero-4.png" alt="Hero option 4"></div></figure><figure style="margin-top:36px"><div class="eyebrow">Option 5</div><h2 style="font-size:24px">From spreadsheet to books</h2><p class="sub" style="margin:6px 0 14px">A messy #REF! spreadsheet on the left,
