<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{--brand:#0E6B64;--brand-deep:#0A524C;--ink:#1A2523;--slate:#3E4A47;--paper:#F7F5EF;--card:#FCFBF8;--border:#D8D2C2;--gold:#F4B860;--gold-tint:#FBF3DE;--teal-tint:#E4F0EE;--teal-br:#CBE2DE;--teal-lt:#7FC9BF;--mist:#B8C2BD;--rust:#B04A2E;--green:#0E6B64}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:760px;overflow:hidden;background:var(--paper);font-family:"Schibsted Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1200px;height:760px}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.frame{position:absolute;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px rgba(26,37,35,.16);overflow:hidden}
.frame img{display:block}
.chip{position:absolute;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(26,37,35,.10)}
.chip.gold{background:var(--gold-tint);border-color:#E8CD8E;color:#7A5A12}
.lbl{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand)}
.mono{font-variant-numeric:tabular-nums}
</style></head><body><div class="stage">
<div class="blob" style="left:-80px;top:420px;width:520px;height:520px;background:var(--teal-tint)"></div>
<div class="blob" style="left:900px;top:-120px;width:420px;height:420px;background:var(--gold-tint)"></div>
<div class="frame" style="left:120px;top:60px;width:960px;padding:36px 40px 40px;border-radius:22px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div><div class="lbl">This year · LedgerCaddy Sample Book</div>
      <div style="font-size:16px;font-weight:800;color:var(--slate);margin-top:10px">Net this period</div>
      <div class="mono" style="font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1;margin-top:4px">$8,492<span style="font-size:36px;color:var(--slate)">.43</span></div></div>
    <div style="background:var(--teal-tint);border:1.5px solid var(--teal-br);border-radius:999px;padding:10px 16px;font-weight:900;color:var(--brand-deep);font-size:15px;margin-top:8px">▲ Up every month since April</div>
  </div>
  <svg width="760" height="150" viewBox="0 0 760 150" style="margin-top:22px;display:block;overflow:visible">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0E6B64" stop-opacity=".28"/><stop offset="1" stop-color="#0E6B64" stop-opacity="0"/></linearGradient></defs>
    <path d="M0,120 L69,112 L138,118 L207,98 L276,104 L345,84 L415,90 L484,70 L553,76 L622,58 L691,62 L760,40 L760,150 L0,150 Z" fill="url(#g)"/><path d="M0,120 L69,112 L138,118 L207,98 L276,104 L345,84 L415,90 L484,70 L553,76 L622,58 L691,62 L760,40" fill="none" stroke="#0E6B64" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="760" cy="40" r="7" fill="#0E6B64" stroke="#fff" stroke-width="3"/><text x="0" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">JAN</text><text x="69" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">FEB</text><text x="138" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">MAR</text><text x="207" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">APR</text><text x="276" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">MAY</text><text x="345" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">JUN</text><text x="415" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">JUL</text><text x="484" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">AUG</text><text x="553" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">SEP</text><text x="622" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">OCT</text><text x="691" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">NOV</text><text x="760" y="172" font-size="12" font-weight="800" fill="#3E4A47" text-anchor="middle" font-family="Schibsted Grotesk">DEC</text>
  </svg>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:40px">
    <div style="border:1.5px solid var(--border);border-radius:14px;padding:16px 18px"><div class="lbl" style="color:var(--slate)">Money in</div><div class="mono" style="font-size:30px;font-weight:900;color:var(--green);margin-top:4px">$14,718.97</div></div>
    <div style="border:1.5px solid var(--border);border-radius:14px;padding:16px 18px"><div class="lbl" style="color:var(--slate)">Money out</div><div class="mono" style="font-size:30px;font-weight:900;color:var(--rust);margin-top:4px">$6,226.54</div></div>
    <div style="border:1.5px solid #E8CD8E;background:var(--gold-tint);border-radius:14px;padding:16px 18px"><div class="lbl" style="color:#7A5A12">Tax collected</div><div class="mono" style="font-size:30px;font-weight:900;color:#7A5A12;margin-top:4px">$2,409.67</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:18px;font-size:14px;font-weight:800;color:var(--slate)">
    <div>Rent <span class="mono" style="float:right;color:var(--rust)">$3,849.57</span><div style="height:6px;background:var(--teal-br);border-radius:3px;margin-top:6px"><div style="width:100%;height:6px;background:var(--brand);border-radius:3px"></div></div></div><div>Groceries <span class="mono" style="float:right;color:var(--rust)">$776.37</span><div style="height:6px;background:var(--teal-br);border-radius:3px;margin-top:6px"><div style="width:20%;height:6px;background:var(--brand);border-radius:3px"></div></div></div><div>Utilities <span class="mono" style="float:right;color:var(--rust)">$400.30</span><div style="height:6px;background:var(--teal-br);border-radius:3px;margin-top:6px"><div style="width:10%;height:6px;background:var(--brand);border-radius:3px"></div></div></div>
  </div>
</div>
</div></body></html>
