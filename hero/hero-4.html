<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{--brand:#0E6B64;--brand-deep:#0A524C;--ink:#1A2523;--slate:#3E4A47;--paper:#F7F5EF;--card:#FCFBF8;--border:#D8D2C2;--gold:#F4B860;--gold-tint:#FBF3DE;--teal-tint:#E4F0EE;--teal-br:#CBE2DE;--teal-lt:#7FC9BF;--mist:#B8C2BD;--rust:#B04A2E;--green:#0E6B64}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:760px;overflow:hidden;background:var(--paper);font-family:"Schibsted Grotesk",-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1200px;height:760px}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.frame{position:absolute;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px rgba(26,37,35,.16);overflow:hidden}
.frame img{display:block}
.chip{position:absolute;background:var(--card);border:1.5px solid var(--border);border-radius:999px;padding:10px 16px;font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(26,37,35,.10)}
.chip.gold{background:var(--gold-tint);border-color:#E8CD8E;color:#7A5A12}
.lbl{font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand)}
.mono{font-variant-numeric:tabular-nums}
</style></head><body><div class="stage">
<div class="blob" style="left:200px;top:40px;width:800px;height:680px;background:var(--teal-tint)"></div>
<svg width="1200" height="760" viewBox="0 0 1200 760" style="position:absolute;left:0;top:0">
  <rect x="300" y="120" width="600" height="380" rx="22" fill="#fff" stroke="#D8D2C2" stroke-width="3"/>
  <rect x="318" y="138" width="564" height="344" rx="12" fill="#F7F5EF"/>
  <path d="M220 520 H980 a24 24 0 0 1 -24 34 H244 a24 24 0 0 1 -24 -34 Z" fill="#fff" stroke="#D8D2C2" stroke-width="3"/>
  <rect x="540" y="520" width="120" height="8" rx="4" fill="#D8D2C2"/>
</svg>
<div class="frame" style="left:392px;top:200px;width:416px;border-radius:18px;padding:26px 28px;text-align:center;box-shadow:0 18px 40px rgba(26,37,35,.14)">
  <div style="width:72px;height:72px;border-radius:18px;background:var(--ink);color:var(--gold);font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto">LS</div>
  <div style="font-size:19px;font-weight:900;margin-top:16px;letter-spacing:-.3px">LedgerCaddy Sample Book</div>
  <div style="font-size:13px;font-weight:700;color:var(--slate);margin-top:4px">.ledgercaddy.sqlite · 0.3 MB · 36 transactions</div>
  <div style="font-size:14px;font-weight:800;color:var(--brand-deep);margin-top:14px;background:var(--teal-tint);border-radius:999px;padding:8px 12px;display:inline-block">Your whole book, in one file</div>
</div>
<div class="chip" style="left:120px;top:250px;color:var(--brand-deep)">✓ No cloud</div>
<div class="chip" style="left:100px;top:330px;color:var(--brand-deep)">✓ No account, no sign-in</div>
<div class="chip" style="left:140px;top:410px;color:var(--brand-deep)">✓ Works offline</div>
<div class="chip" style="left:920px;top:280px;color:var(--brand-deep)">✓ Back it up like any document</div>
<div class="chip gold" style="left:900px;top:360px">✓ Yours forever</div>
<div style="position:absolute;left:0;right:0;top:612px;text-align:center;font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.3px">Private by design. Nothing leaves your Mac.</div>
</div></body></html>
