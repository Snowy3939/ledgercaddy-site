<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{--brand:#0E6B64;--deep:#0A524C;--ink:#1A2523;--slate:#3E4A47;--paper:#F7F5EF;--card:#FCFBF8;--border:#D8D2C2;--gold:#F4B860;--goldd:#D99A2B;--gt:#FBF3DE;--tt:#E4F0EE;--tb:#CBE2DE;--tl:#7FC9BF;--rust:#B04A2E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:760px;overflow:hidden;background:var(--paper);font-family:"Schibsted Grotesk",-apple-system,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1200px;height:760px}
svg{position:absolute;left:0;top:0}
.chip{position:absolute;background:#fff;border:1.5px solid var(--border);border-radius:999px;padding:12px 18px;font-weight:900;font-size:16px;box-shadow:0 10px 30px rgba(26,37,35,.12);color:var(--deep)}
.chip.gold{background:var(--gt);border-color:#E8CD8E;color:#7A5A12}
.big{position:absolute;font-weight:900;letter-spacing:-2px;line-height:1}
.mono{font-variant-numeric:tabular-nums}
